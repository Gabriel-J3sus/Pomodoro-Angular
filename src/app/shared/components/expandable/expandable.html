<section class="flex flex-col" (click)="isExpanded() ? onCollapse() : onExpand()">
  <div class="flex items-center justify-between border-b-1 border-zinc-300 text-zinc-400">

    <div class="flex items-center gap-2">
      @if(icon()) {
        <ng-icon      
          [name]="icon()"
          [size]="iconSizeMap['sm']"
        ></ng-icon>
      }

      @if(title()) {
        <p class="text-lg">{{ title() }}</p>
      }
    </div>
    
    <ng-icon
      name="remixArrowDownSLine"
      [size]="iconSizeMap['sm']"
      class="cursor-pointer transition-transform duration-500 ease-in-out"
      [class.rotate-180]="!isExpanded()"
    />
  </div>

  <div
    class="grid overflow-hidden transition-[grid-template-rows] duration-500 ease-in-out"
    [class.grid-rows-[0fr]]="!isExpanded()"
    [class.grid-rows-[1fr]]="isExpanded()"
  >
    <div class="min-h-0 pt-3 pl-3 text-sm">
      <ng-content />
    </div>
  </div>
</section>
